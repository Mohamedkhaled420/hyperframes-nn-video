<!DOCTYPE html>
<html lang="en" data-composition-duration="40" data-composition-fps="30"
      data-composition-variables='{"captions": true}'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperframes · Recap — Putting it together</title>
<style>
  html, body { margin:0; padding:0; background:#0f141c; overflow:hidden; }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:top left; }
  #root  { display:block; }
  svg text { user-select:none; }
  #root * { transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body data-composition-duration="40" data-composition-fps="30">
<div id="stage">
  <svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
</div>
<script>
window.__SCENE_DUR__ = 40;
window.__hyperframes = window.__hyperframes || {
  getVariables: function(){ return { captions: true }; }
};
const DATA = {"narr":[[1.0,4.5,"Let us put it together. A picture is a list of numbers."],[6.0,4.5,"A neuron takes a weighted sum, adds a bias and squashes the result."],[11.0,4.5,"Neurons stack in layers, joined by weights. Ours had 562."],[16.0,4.5,"A cost function turns 'how wrong' into a single number."],[21.0,4.5,"Gradient descent says: nudge every weight downhill."],[26.0,4.5,"Backpropagation finds every slope by sending blame backwards."],[31.0,4.0,"In one line: new weights equal old weights, minus a step downhill."],[35.5,4.0,"Change the hidden layer's size and see what breaks. That is how intuition grows."]]};
/* ============================================================ engine.js ==
 * Deterministic SVG timeline engine for Hyperframes compositions.
 * Every frame is a pure function of time t: render(t) folds all registered
 * operations and applies element states. No accumulation, no randomness.
 * ======================================================================== */
'use strict';
const SVG_NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('root');
const DUR = window.__SCENE_DUR__;

const C = {
  bg:'#0f141c', panel:'#161d29', panel2:'#1a2230', line:'#2a3342',
  text:'#E8EDF4', dim:'#93A1B3', faint:'#5A6675',
  blue:'#58C4DD', teal:'#5FD3BC', green:'#7EC96B', yellow:'#FFE45C',
  orange:'#FF9F43', red:'#FC6255', purple:'#B57EDC', gold:'#FFC53D', grey:'#4E5A68'
};
const FONT_S = "'Liberation Sans','DejaVu Sans',Arial,sans-serif";
const FONT_M = "'Liberation Mono','DejaVu Sans Mono',Menlo,Consolas,monospace";

/* -------------------------------------------------- element constructors */
function el(tag, attrs, parent){
  const e = document.createElementNS(SVG_NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
function G(parent){ return el('g', null, parent || svg); }

function T(html, x, y, o, parent){
  o = o || {};
  const size = o.size || 40, anchor = o.anchor || 'middle';
  const anchorMap = { m: 'middle', l: 'start', r: 'end', start: 'start', end: 'end', middle: 'middle' };
  const t = el('text', {
    x, y, 'text-anchor': anchorMap[anchor] || 'middle',
    'font-family': o.mono ? FONT_M : FONT_S,
    'font-size': size, fill: o.color || C.text,
    'font-weight': o.weight || '400',
    'letter-spacing': o.ls != null ? o.ls : '0.5'
  }, parent || o.parent || svg);
  const lines = String(html).split(/<br\s*\/?>/);
  lines.forEach((ln, i) => {
    const ts = el('tspan', { x, dy: i === 0 ? 0 : size * 1.3 }, t);
    ts.textContent = ln;
  });
  if (!o.show) t.style.opacity = 0;
  return t;
}
function stext(html, x, y, o){ return T(html, x, y, Object.assign({ size: 30 }, o || {})); }

function rect(x, y, w, h, o, parent){
  o = o || {};
  return el('rect', { x, y, width: w, height: h, rx: o.rx || 0,
    fill: o.fill || 'none', stroke: o.stroke, 'stroke-width': o.w,
    'stroke-dasharray': o.dash }, parent);
}
function circle(cx, cy, r, o, parent){
  o = o || {};
  return el('circle', { cx, cy, r, fill: o.fill || 'none', stroke: o.stroke,
    'stroke-width': o.w }, parent);
}
function line(x1, y1, x2, y2, o, parent){
  o = o || {};
  return el('line', { x1, y1, x2, y2, stroke: o.stroke || C.grey,
    'stroke-width': o.w || 2, 'stroke-linecap': 'round',
    'stroke-dasharray': o.dash }, parent || svg, parent);
}
function path(d, o, parent){
  o = o || {};
  return el('path', { d, fill: o.fill || 'none', stroke: o.stroke || C.text,
    'stroke-width': o.w || 3, 'stroke-linecap': 'round',
    'stroke-linejoin': 'round', 'stroke-dasharray': o.dash }, parent);
}

const defs = el('defs', null);
const markers = {};
function arrowMarker(color){
  if (markers[color]) return markers[color];
  const id = 'ah' + Object.keys(markers).length;
  const m = el('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5,
    markerWidth: 7.5, markerHeight: 7.5, orient: 'auto-start-reverse' }, defs);
  el('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }, m);
  markers[color] = id;
  return id;
}
function arrow(x1, y1, x2, y2, o, parent){
  o = o || {};
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L, sh = o.sh != null ? o.sh : 9;
  const col = o.stroke || C.grey;
  return el('line', { x1, y1, x2: x2 - ux * sh, y2: y2 - uy * sh, stroke: col,
    'stroke-width': o.w || 3, 'stroke-linecap': 'round',
    'stroke-dasharray': o.dash, 'marker-end': 'url(#' + arrowMarker(col) + ')' }, parent);
}

/* 5x7 pixel grid of values in [0,1] */
function grid(x, y, cell, cols, rows, data, o){
  o = o || {};
  const g = G(o.parent), gap = o.gap != null ? o.gap : 1, cells = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const v = data ? data[r * cols + c] : 0;
    const fill = v > 0.03 ? 'rgba(232,237,244,' + Math.min(1, v).toFixed(3) + ')'
                          : (o.empty || '#1a212d');
    cells.push(el('rect', { x: x + c * (cell + gap), y: y + r * (cell + gap),
      width: cell, height: cell, rx: cell * 0.16, fill }, g));
  }
  g.style.opacity = o.show ? 1 : 0;
  return { g, cells, x, y, cell, cols, rows, gap };
}

/* diverging heat grid: blue positive / red negative */
function heat(x, y, cell, cols, rows, data, o){
  o = o || {};
  const g = G(o.parent), gap = o.gap != null ? o.gap : 1, cells = [];
  const max = o.max || 0.001;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const v = (data && data[r * cols + c]) || 0;
    const m = Math.min(1, Math.abs(v) / max);
    const rgb = v >= 0 ? '88,196,221' : '252,98,85';
    cells.push(el('rect', { x: x + c * (cell + gap), y: y + r * (cell + gap),
      width: cell, height: cell, rx: cell * 0.16,
      fill: m < 0.08 ? '#1a212d' : 'rgba(' + rgb + ',' + (0.18 + 0.82 * m).toFixed(3) + ')' }, g));
  }
  g.style.opacity = o.show ? 1 : 0;
  return { g, cells };
}

/* probability bars for 10 digits */
function bars(x, y, w, h, o){
  o = o || {};
  const g = G(o.parent);
  g.style.opacity = o.show ? 1 : 0;
  const n = 10, gap = o.gap != null ? o.gap : 10;
  const bw = (w - (n - 1) * gap) / n;
  const base = el('rect', { x, y, width: w, height: 2, fill: C.line }, g);
  const rects = [], labs = [], vals = [];
  for (let i = 0; i < n; i++){
    const bx = x + i * (bw + gap);
    el('rect', { x: bx, y: y - h, width: bw, height: h, fill: 'rgba(255,255,255,0.045)', rx: 3 }, g);
    rects.push(el('rect', { x: bx, y, width: bw, height: 0, rx: 3, fill: o.color || C.blue }, g));
    vals.push(T('', bx + bw / 2, y - h - 12, { size: o.vsize || 24, color: C.dim, show: true, parent: g }));
    labs.push(T(String(i), bx + bw / 2, y + 32, { size: o.lsize || 26, color: C.dim, show: true, parent: g }));
  }
  const api = {
    g, rects, vals, base,
    set(values){
      for (let i = 0; i < n; i++){
        const v = Math.max(0, Math.min(1, values[i]));
        rects[i].setAttribute('y', y - v * h);
        rects[i].setAttribute('height', Math.max(0, v * h));
        vals[i].textContent = Math.round(v * 100) + '%';
        vals[i].setAttribute('fill', v > 0.005 ? C.dim : '#39424e');
      }
    },
    highlight(i, color){
      labs.forEach((L, k) => L.setAttribute('fill', k === i ? (color || C.gold) : C.dim));
      rects.forEach((R, k) => R.setAttribute('fill', k === i ? (color || C.gold) : (o.color || C.blue)));
    }
  };
  return api;
}

/* ------------------------------------------------------------- timeline -- */
const OPS = [], SYNCS = [];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const easeIO = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOutC = p => 1 - Math.pow(1 - p, 3);
const easeBack = p => { const c = 1.70158 * 0.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function lerpA(a, b, p){ return a.map((v, i) => lerp(v, b[i], p)); }

function reg(op){ OPS.push(op); return op; }
function sync(fn, t0, t1){ SYNCS.push({ fn, t0, t1 }); }
/* fade in (optionally rising by o.y px) */
function fade(e, t0, dur, o){ o = o || {}; return reg({ el: e, type: 'fade', t0, dur, rise: o.y || 0 }); }
function pop(e, t0, dur){ return reg({ el: e, type: 'pop', t0, dur }); }
function wipe(e, t0, dur){ e._wipe = true; return reg({ el: e, type: 'wipe', t0, dur }); }
function out(e, t0, dur){ return reg({ el: e, type: 'out', t0, dur }); }
function to(e, t0, dur, props){ return reg({ el: e, type: 'to', t0, dur, to: props }); }
function draw(e, t0, dur){
  if (e.getTotalLength){ try { e._len = e.getTotalLength() + 2; } catch (_) { e._len = null; } }
  e._draw = true;
  return reg({ el: e, type: 'draw', t0, dur });
}

/* interpolate numeric object keyframes for custom properties (bars, dots...) */
function tween(obj, key, t0, t1, v0, v1, ease){
  sync(p => { obj[key] = lerp(v0, v1, (ease || easeIO)(p)); }, t0, t1);
}

/* ------------------------------------------------------------- captions -- */
function wrapText(s, maxChars){
  const words = String(s).split(' '), lines = [];
  let cur = '';
  for (const w of words){
    if ((cur ? cur + ' ' + w : w).length > maxChars && cur){ lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}

function captions(narr, o){
  o = o || {};
  const SIZE = o.size || 33, LH = SIZE * 1.3, MAXC = o.maxChars || 86;
  const groups = narr.map(entry => {
    const t0 = entry[0], t1 = entry[0] + entry[1];
    const lines = wrapText(entry[2], MAXC);
    const g = G();
    const w = Math.max.apply(null, lines.map(l => l.length)) * SIZE * 0.5 + 60;
    const top = 1006 - (lines.length - 1) * LH - SIZE * 1.15 - 12;
    const h = (lines.length - 1) * LH + SIZE * 1.55 + 16;
    el('rect', { x: 960 - w / 2, y: top, width: w, height: h, rx: 12, fill: 'rgba(5,8,13,0.68)' }, g);
    T(lines.join('<br>'), 960, 1006 - (lines.length - 1) * LH, { size: SIZE, color: '#DCE4EE', show: true, ls: '0.2' }, g);
    g.style.opacity = 0;
    return { g, t0, t1 };
  });
  sync((p, t) => {
    let act = null;
    for (const c of groups) if (t >= c.t0 - 0.05 && t <= c.t1) act = c;
    for (const c of groups) c.g.style.opacity = c === act ? 1 : 0;
  }, 0, DUR);
}

/* --------------------------------------------------------- chapter chip -- */
function begin(o){
  const g = G();
  el('circle', { cx: 66, cy: 60, r: 8, fill: o.color || C.blue }, g);
  T((o.n || '') + '  ·  ' + (o.title || ''), 90, 69, { size: 27, color: C.dim, anchor: 'start', show: true, ls: '1.5' }, g);
  fade(g, 0.4, 0.8);
  return g;
}

/* -------------------------------------------------------- progress bar --- */
function progressBar(accent){
  const pg = el('rect', { x: 0, y: 1076, width: 0, height: 4, fill: accent || C.blue, opacity: 0.5 });
  sync((p, t) => pg.setAttribute('width', (1920 * clamp(t / DUR, 0, 1)).toFixed(1)), 0, DUR);
}

/* ---------------------------------------------------------- state fold --- */
let STATES = [];
function initStates(){
  const byEl = new Map();
  for (const op of OPS){
    if (!op.el) continue;
    if (!byEl.has(op.el)) byEl.set(op.el, []);
    byEl.get(op.el).push(op);
  }
  STATES = [];
  byEl.forEach((ops, elm) => {
    ops.sort((a, b) => a.t0 - b.t0);
    const base = {
      o: parseFloat(getComputedStyle(elm).opacity) || 0,
      x: 0, y: 0, s: 1,
      clip: elm._wipe ? 0 : 1,
      dash: (elm._draw && elm._len != null) ? 0 : 1
    };
    STATES.push({ el: elm, ops, st: base });
  });
}

function foldAll(t){
  for (const s of STATES){
    const st = { o: s.st.o, x: 0, y: 0, s: 1, clip: s.st.clip, dash: s.st.dash };
    for (const op of s.ops){
      const p = op.dur > 0 ? clamp((t - op.t0) / op.dur, 0, 1) : (t >= op.t0 ? 1 : 0);
      switch (op.type){
        case 'fade': { const e = easeOutC(p); st.o = e; st.y += (1 - e) * op.rise; break; }
        case 'out':  { if (p > 0){ const e = easeIO(p); st.o = 1 - e; st.y += e * 10; } break; }
        case 'pop':  { const e = easeBack(p); st.o = Math.min(1, e * 1.6); st.s = 0.62 + 0.38 * e; break; }
        case 'wipe': { const e = easeIO(p); st.clip = e; st.o = Math.max(st.o, e); break; }
        case 'draw': { const e = easeIO(p); st.dash = e; st.o = e; break; }
        case 'to': {
          const e = easeIO(p), k = op.to || {};
          if ('o' in k) st.o = lerp(st.o, k.o, e);
          if ('x' in k) st.x = lerp(st.x, k.x, e);
          if ('y' in k) st.y = lerp(st.y, k.y, e);
          if ('s' in k) st.s = lerp(st.s, k.s, e);
          break;
        }
      }
    }
    applyState(s.el, st);
  }
}

function applyState(e, st){
  e.style.opacity = st.o < 0.004 ? 0 : st.o.toFixed(3);
  let tf = '';
  if (st.x || st.y) tf += 'translate(' + st.x.toFixed(2) + 'px,' + st.y.toFixed(2) + 'px)';
  if (st.s !== 1) tf += (tf ? ' ' : '') + 'scale(' + st.s.toFixed(3) + ')';
  e.style.transform = tf || 'none';               /* always write: clears stale state on seeks */
  e.style.clipPath = st.clip >= 1 ? 'none'
    : 'inset(-8% ' + (100 * (1 - st.clip)).toFixed(2) + '% -8% -8%)';
  if (e._len != null){
    e.setAttribute('stroke-dasharray', e._len.toFixed(1));
    e.setAttribute('stroke-dashoffset', ((1 - st.dash) * e._len).toFixed(1));
  }
}

/* ------------------------------------------------------------- render ---- */
let curT = -1;
function render(t){
  t = clamp(t, 0, DUR);
  curT = t;
  foldAll(t);
  for (const s of SYNCS){
    if (t < s.t0) continue;                    // not started: fn must not touch state
    const p = s.t1 > s.t0 ? clamp((t - s.t0) / (s.t1 - s.t0), 0, 1) : 1;
    s.fn(p, t);
  }
}

/* ------------------------------------------------------------- player ---- */
function fitStage(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}

function boot(){
  fitStage();
  window.addEventListener('resize', fitStage);
  initStates();
  render(0);

  /* external seek contract (renderer adapters) */
  let manual = false;
  function seek(t){ manual = true; render(+t || 0); }
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d && typeof d.t === 'number' && (d.type === 'hf-seek' || d.type === 'seek' || d.type === 'seekto')) seek(d.t);
  });
  window.addEventListener('hf-seek', e => { if (e.detail != null) seek(e.detail); });
  window.__scene = { render: seek, peek: render, duration: DUR, version: '1.0' };
  window.__dbg = { STATES, OPS, SYNCS, easeBack, clamp };

  /* realtime autoplay fallback: if a driver seeks, we stop driving.
     '#freeze' disables autoplay (used by QA/render adapters that drive frames). */
  let t0p = performance.now(), base = 0;
  if (location.hash.indexOf('freeze') < 0){
    function auto(now){
      if (manual) return;
      const t = base + (now - t0p) / 1000;
      if (t >= DUR){ render(DUR); return; }
      render(t);
      requestAnimationFrame(auto);
    }
    requestAnimationFrame(auto);
  }

  /* optional preview UI: only when opened with #preview */
  if (location.hash.indexOf('preview') >= 0) previewUI(seek);
}

function previewUI(seek){
  const ui = G();
  ui.style.opacity = 0.92;
  const bw = 54, bx = 1920 - 300, by = 1030;
  el('rect', { x: bx, y: by, width: 240, height: 36, rx: 8, fill: 'rgba(10,14,20,0.8)', stroke: C.line }, ui);
  const playG = el('g', { transform: 'translate(' + (bx + 27) + ',' + (by + 18) + ')' }, ui);
  const iconPlay = el('path', { d: 'M-7,-9 L9,0 L-7,9 Z', fill: C.text }, playG);
  const iconPause = el('path', { d: 'M-7,-9 L-2,-9 L-2,9 L-7,9 Z M4,-9 L9,-9 L9,9 L4,9 Z', fill: C.text, visibility: 'hidden' }, playG);
  const timeTxt = T('0.0 / ' + DUR.toFixed(0) + 's', bx + 145, by + 24, { size: 19, color: C.dim, show: true, mono: true }, ui);

  let playing = true, base = curT, t0p = performance.now();
  function loop(now){
    if (playing){
      const t = base + (now - t0p) / 1000;
      if (t >= DUR){ render(DUR); playing = false; base = 0; }
      else render(t);
    }
    timeTxt.textContent = curT.toFixed(1) + ' / ' + DUR.toFixed(0) + 's';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  function toggle(){
    if (playing){ base = curT; playing = false; }
    else { t0p = performance.now(); playing = true; }
    iconPlay.setAttribute('visibility', playing ? 'hidden' : 'visible');
    iconPause.setAttribute('visibility', playing ? 'visible' : 'hidden');
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'Space'){ e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight'){ playing = false; render(curT + (e.shiftKey ? 5 : 1)); base = curT; }
    else if (e.key === 'ArrowLeft'){ playing = false; render(curT - (e.shiftKey ? 5 : 1)); base = curT; }
  });
  playG.addEventListener('click', toggle);
  el('rect', { x: bx, y: by, width: 240, height: 36, rx: 8, fill: 'transparent', style: 'cursor:pointer' }, ui)
    .addEventListener('click', toggle);
}

document.readyState === 'loading'
  ? document.addEventListener('DOMContentLoaded', boot)
  : boot();

/* s12 — Recap · Putting it together (40s) */
(function(){
begin({ n:'Recap', title:'Putting it together', color:C.blue });

const rows = [
  ['A picture is a list of numbers',        '[ 0.0, 0.9, 0.8, … ]'],
  ['A neuron: weighted sum, bias, squash',  'σ( Σ w·x + b )'],
  ['Layers of neurons, joined by weights',  '35 → 12 → 10'],
  ['A cost says how wrong we are',          '− ln p'],
  ['Gradient descent: step downhill',       'w ← w − η ∂C/∂w'],
  ['Backpropagation: blame, backwards',     'chain rule']
];
const pal = [C.blue, C.teal, C.green, C.yellow, C.orange, C.red];
const times = [1.2, 6.2, 11.2, 16.2, 21.2, 26.2];
const rowEls = [];
rows.forEach((r, i) => {
  const y = 195 + i * 105;
  const g = G();
  circle(250, y, 28, { stroke: pal[i], w: 4, fill: C.panel2 }, g);
  T(String(i + 1), 250, y + 11, { size: 30, color: pal[i], mono: true, show: true }, g);
  const t1 = T(r[0], 320, y + 12, { size: 38, anchor: 'start', show: true }, g);
  const t2 = T(r[1], 1660, y + 10, { size: 34, mono: true, color: pal[i], anchor: 'end', show: true }, g);
  pop(g, times[i], 0.55);
  fade(t1, times[i] + 0.15, 0.55, { y: 10 });
  fade(t2, times[i] + 0.35, 0.55);
  rowEls.push(g, t1, t2);
});

/* collapse to one rule */
rowEls.forEach(e => to(e, 30.8, 0.6, { o: 0.22 }));
const fm = T('θ  ←  θ − η ∇C(θ)', 960, 880, { size: 80, mono: true, weight: '700' });
wipe(fm, 31.4, 1.5);

/* challenge */
rowEls.forEach(e => out(e, 35.2, 0.5));
to(fm, 35.4, 0.9, { y: -340, s: 0.82 });
const ch = T('Change the size of the hidden layer.<br>See what breaks.', 960, 660, { size: 56, weight: '700' });
wipe(ch, 36.2, 1.4);
const sub = T('that is how intuition is built', 960, 810, { size: 36, color: C.dim });
fade(sub, 38.0, 0.7);

captions(DATA.narr);
progressBar(C.blue);
})();

</script>
</body>
</html>
