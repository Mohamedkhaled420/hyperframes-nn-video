<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0e14;overflow:hidden}svg{display:block}</style>
</head><body>
<script src="/vendor/motion.js"></script>
<script>
MT.scene({duration:50});
const C=MT.C;
/* ---- data (must be defined first) ---- */
const NN_FLAT3=['00000','01110','10011','00001','00110','00000','01000'].join('').split('').map(Number).map(v=>v?0.9:0.04);
const SMALL=[];const rr=MT.rng(7);
for(let i=0;i<784;i++){const x=(i%28)/28,y=((i/28)|0)/28;
  const d=Math.hypot(x-0.5,y-0.32),d2=Math.hypot(x-0.45,y-0.75);
  SMALL.push(Math.max(0, Math.min(1,(d<0.22||d2<0.18)?0.75+rr()*0.25:rr()<0.06?0.5:0.05)));}
MT.heading('Chapter 1 · Pictures are numbers','Start with five by seven');

/* ---- stage 1: digit grid (1.2 → 10.8) ---- */
const x0=560,y0=200,cs=64;
const dg=MT.grid(x0,y0,cs,5,7,NN_FLAT3,{gap:4});
MT.fade(dg.g,1.2,0.6,{y:14});
const lab3=MT.T('a handwritten "3"',x0+cs*2.5,y0+7*68+50,{size:32,color:C.dim});
MT.fade(lab3,2.0,0.5);
/* zoom box around one pixel (5.5) */
const zx=x0+3*68,zy=y0+1*68;
const zb=MT.rect(zx-8,zy-8,84,84,{stroke:C.amber,w:4,rx:10});
MT.fade(zb,5.7,0.35);
const zl=MT.T('one brightness: 0 … 1',zx+110,zy+34,{size:32,color:C.amber,anchor:'start'});
MT.fade(zl,6.0,0.4,{x:-14});
/* numbers fade in (10.0) */
const nums=dg.numbers(22);
MT.stag(nums,10.0,0.035,(el)=>MT.fade(el,0,0.25));
MT.out([dg.g,zb,zl],16.4,0.5,{y:-20});nums.forEach(n=>MT.exit(n,16.4,0.4));

/* ---- stage 2: flatten into a column (17.0 → 28.4) ---- */
const N=NN_FLAT3;
const colG=MT.G();
const fly=[];  // flying squares
const colX=1330,colY=180;
N.forEach((v,i)=>{
  const r=(i/5)|0,c=i%5;
  const sx=x0+c*68,sy=y0+r*68;
  const sq=MT.rect(sx,sy,64,64,{rx:8,fill:`rgba(125,211,252,${0.05+0.95*v})`,parent:colG});
  sq._tr={x:0,y:0,s:1,r:0,cx:0,cy:0};
  MT.move(sq,17.0+i*0.05,0.7,{x:colX-sx,y:colY+i*24-sy,r:0},MT.EASE.inOut);
  fly.push(sq);
});
const brL=MT.T('[',colX-70,colY+80,{size:190,w:300,color:C.faint});
const brR=MT.T(']',colX+140,colY+80,{size:190,w:300,color:C.faint});
MT.fade(brL,17.6,0.4);MT.fade(brR,17.6,0.4);
const xlab=MT.T('x  =  a list of 35 numbers',colX+40,colY+7*24+150,{size:42,mono:true,color:C.ink});
MT.fade(xlab,22.4,0.6,{y:12});
const dim=MT.rect(300,140,700,640,{rx:20,fill:C.panel,opacity:0.35,stroke:C.line,w:2});
MT.fade(dim,17.0,0.5);
MT.out([colG,brL,brR,xlab,dim],28.6,0.55);

/* ---- stage 3: scale up (29.0 → 41.6) ---- */
const g28=MT.grid(660,220,18,28,28,SMALL,{gap:1});
MT.fade(g28.g,29.2,0.7);
const l28=MT.T('28 × 28  =  784 numbers',960,600,{size:46,mono:true});
MT.fade(l28,30.2,0.5,{y:10});
MT.out([g28.g,l28],34.6,0.45);
const lphoto=MT.T('a phone photo: 4000 × 3000 × 3  =  36,000,000 numbers',960,320,{size:44,mono:true,color:C.ink});
MT.fade(lphoto,35.4,0.6,{y:12});
const lphoto2=MT.T('only the length of the list changes',960,400,{size:36,color:C.dim});
MT.fade(lphoto2,36.4,0.5,{y:10});
MT.out([lphoto,lphoto2],41.4,0.45);

/* ---- stage 4: closing line (42.2) ---- */
const fin=MT.T('A picture is a list of numbers.',960,470,{size:72,w:620});
MT.wipe(fin,42.2,0.8);
const fin2=MT.T('Learning to see = learning from lists.',960,580,{size:40,color:C.dim});
MT.fade(fin2,44.0,0.6,{y:10});

MT.ready();
</script></body></html>
