/* 5x7 pixel grid of values in [0,1] */

  o = o || {};

function wrapText(s, maxChars){
  const words = String(s).split(' '), lines = [];
  let cur = '';

    if ((cur ? cur + ' ' + w : w).length > maxChars && cur){ lines.push(cur); cur = w; }

  }
  if (cur) lines.push(cur);
  return lines.slice(0, 3);
}

  for (const op of OPS){
    if (!op.el) continue;
    if (!byEl.has(op.el)) byEl.set(op.el, []);
    byEl.get(op.el).push(op);
  }
  STATES = [];
  byEl.forEach((ops, elm) => {
    ops.sort((a, b) => a.t0 - b.t0);
    const base = {
      o: parseFloat(getComputedStyle(elm).opacity) || 0,
      x: 0, y: 0, s: 1,
      clip: elm._wipe ? 0 : 1,
      dash: (elm._draw && elm._len != null) ? 0 : 1
    };
    STATES.push({ el: elm, ops, st: base });
  });
}

function foldAll(t){
  for (const s of STATES){
    const st = { o: s.st.o, x: 0, y: 0, s: 1, clip: s.st.clip, dash: s.st.dash };
    for (const op of s.ops){
      const p = op.dur > 0 ? clamp((t - op.t0) / op.dur, 0, 1) : (t >= op.t0 ? 1 : 0);
      switch (op.type){
        case 'fade': { const e = easeOutC(p); st.o = e; st.y += (1 - e) * op.rise; break; }
        case 'out':  { if (p > 0){ const e = easeIO(p); st.o = 1 - e; st.y += e * 10; } break; }
        case 'pop':  { const e = easeBack(p); st.o = Math.min(1, e * 1.6); st.s = 0.62 + 0.38 * e; break; }
        case 'wipe': { const e = easeIO(p); st.clip = e; st.o = Math.max(st.o, e); break; }
        case 'draw': { const e = easeIO(p); st.dash = e; st.o = e; break; }
        case 'to': {
          const e = easeIO(p), k = op.to || {};
          if ('o' in k) st.o = lerp(st.o, k.o, e);
          if ('x' in k) st.x = lerp(st.x, k.x, e);
          if ('y' in k) st.y = lerp(st.y, k.y, e);
          if ('s' in k) st.s = lerp(st.s, k.s, e);
          break;
        }
      }
    }
    applyState(s.el, st);
  }
}

function applyState(e, st){
  e.style.opacity = st.o < 0.004 ? 0 : st.o.toFixed(3);
  let tf = '';
  if (st.x || st.y) tf += 'translate(' + st.x.toFixed(2) + 'px,' + st.y.toFixed(2) + 'px)';
  if (st.s !== 1) tf += (tf ? ' ' : '') + 'scale(' + st.s.toFixed(3) + ')';
  e.style.transform = tf || 'none';               /* always write: clears stale state on seeks */
  e.style.clipPath = st.clip >= 1 ? 'none'
    : 'inset(-8% ' + (100 * (1 - st.clip)).toFixed(2) + '% -8% -8%)';
  if (e._len != null){
    e.setAttribute('stroke-dasharray', e._len.toFixed(1));
    e.setAttribute('stroke-dashoffset', ((1 - st.dash) * e._len).toFixed(1));
  }
}

/* ------------------------------------------------------------- render ---- */
let curT = -1;
function render(t){
  t = clamp(t, 0, DUR);
  curT = t;
  foldAll(t);
  for (const s of SYNCS){
    if (t < s.t0) continue;                    // not started: fn must not touch state
    const p = s.t1 > s.t0 ? clamp((t - s.t0) / (s.t1 - s.t0), 0, 1) : 1;
    s.fn(p, t);
  }
}

/* ------------------------------------------------------------- player ---- */
function fitStage(){
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('stage').style.transform = 'scale(' + s + ')';
}

function boot(){
  fitStage();
  window.addEventListener('resize', fitStage);
  initStates();
  render(0);

  /* external seek contract (renderer adapters) */
  let manual = false;
  function seek(t){ manual = true; render(+t || 0); }
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d && typeof d.t === 'number' && (d.type === 'hf-seek' || d.type === 'seek' || d.type === 'seekto')) seek(d.t);
  });
  window.addEventListener('hf-seek', e => { if (e.detail != null) seek(e.detail); });
  window.__scene = { render: seek, peek: render, duration: DUR, version: '1.0' };
  window.__dbg = { STATES, OPS, SYNCS, easeBack, clamp };

  /* realtime autoplay fallback: if a driver seeks, we stop driving.
     '#freeze' disables autoplay (used by QA/render adapters that drive frames). */
  let t0p = performance.now(), base = 0;
  if (location.hash.indexOf('freeze') < 0){
    function auto(now){
      if (manual) return;
      const t = base + (now - t0p) / 1000;
      if (t >= DUR){ render(DUR); return; }
      render(t);
      requestAnimationFrame(auto);
    }
    requestAnimationFrame(auto);
  }

  /* optional preview UI: only when opened with #preview */
  if (location.hash.indexOf('preview') >= 0) previewUI(seek);
}

function previewUI(seek){
  const ui = G();
  ui.style.opacity = 0.92;
  const bw = 54, bx = 1920 - 300, by = 1030;
  el('rect', { x: bx, y: by, width: 240, height: 36, rx: 8, fill: 'rgba(10,14,20,0.8)', stroke: C.line }, ui);
  const playG = el('g', { transform: 'translate(' + (bx + 27) + ',' + (by + 18) + ')' }, ui);
  const iconPlay = el('path', { d: 'M-7,-9 L9,0 L-7,9 Z', fill: C.text }, playG);
  const iconPause = el('path', { d: 'M-7,-9 L-2,-9 L-2,9 L-7,9 Z M4,-9 L9,-9 L9,9 L4,9 Z', fill: C.text, visibility: 'hidden' }, playG);
  const timeTxt = T('0.0 / ' + DUR.toFixed(0) + 's', bx + 145, by + 24, { size: 19, color: C.dim, show: true, mono: true }, ui);

  let playing = true, base = curT, t0p = performance.now();
  function loop(now){
    if (playing){
      const t = base + (now - t0p) / 1000;
      if (t >= DUR){ render(DUR); playing = false; base = 0; }
      else render(t);
    }
    timeTxt.textContent = curT.toFixed(1) + ' / ' + DUR.toFixed(0) + 's';
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  function toggle(){
    if (playing){ base = curT; playing = false; }
    else { t0p = performance.now(); playing = true; }
    iconPlay.setAttribute('visibility', playing ? 'hidden' : 'visible');
    iconPause.setAttribute('visibility', playing ? 'visible' : 'hidden');
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'Space'){ e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight'){ playing = false; render(curT + (e.shiftKey ? 5 : 1)); base = curT; }
    else if (e.key === 'ArrowLeft'){ playing = false; render(curT - (e.shiftKey ? 5 : 1)); base = curT; }
  });
  playG.addEventListener('click', toggle);
  el('rect', { x: bx, y: by, width: 240, height: 36, rx: 8, fill: 'transparent', style: 'cursor:pointer' }, ui)
    .addEventListener('click', toggle);
}

document.readyState === 'loading'
  ? document.addEventListener('DOMContentLoaded', boot)
  : boot();

/* s02 — Chapter 1 · Pictures are numbers (50s) */
(function(){
begin({ n:'Chapter 1', title:'Pictures are numbers', color:C.blue });

const GX = 700, GY = 300, CELL = 34, GAP = 1;
const g3 = grid(GX, GY, CELL, 5, 7, DATA.dig3, { gap: GAP });
fade(g3.g, 1.2, 1.0);
const cap = T('a digit on a grid — 5 pixels wide, 7 tall', 960, 620, { size: 36, color: C.dim });
fade(cap, 2.2, 0.8);

/* highlight one pixel */
const pr = 1, pc = 2;
const bx = GX + pc * (CELL + GAP) - 4, by = GY + pr * (CELL + GAP) - 4;
const box = rect(bx, by, CELL + 8, CELL + 8, { rx: 6, stroke: C.yellow, w: 3.5 });
draw(box, 5.5, 0.7);
const one = T('each square holds one number: its brightness, 0 → 1', 960, 690, { size: 34, color: C.yellow });
fade(one, 6.0, 0.8);

/* cell numbers */
const nums = [];
g3.cells.forEach((rc, i) => {
  const r = Math.floor(i / 5), c = i % 5;
  const v = DATA.dig3[i];
  const t = T(v.toFixed(1), GX + c * (CELL + GAP) + CELL / 2, GY + r * (CELL + GAP) + CELL / 2 + 6,
    { size: 15, color: v > 0.5 ? '#0e131a' : C.faint, show: true });
  nums.push(t);
});
nums.forEach((t, i) => fade(t, 10.0 + (i % 7) * 0.06 + Math.floor(i / 7) * 0.12, 0.3));

/* unroll into a column vector */
const VX = 1330, VCELL = 16, VGAP = 2, VY0 = 185;
const colCells = [];
const flyG = G();
g3.cells.forEach((rc, i) => {
  const r = Math.floor(i / 5), c = i % 5;
  const x0 = GX + c * (CELL + GAP), y0 = GY + r * (CELL + GAP);
  const x1 = VX, y1 = VY0 + i * (VCELL + VGAP);
  const rc2 = el('rect', { x: x0, y: y0, width: CELL, height: CELL, rx: 5,
    fill: rc.getAttribute('fill') }, flyG);
  colCells.push({ rc2, x0, y0, x1, y1, d: i * 0.028 });
});
out(g3.g, 17.0, 0.01);   // grid replaced by flying copies
nums.forEach((t, i) => out(t, 16.99, 0.01));
out(cap, 16.2, 0.4); out(one, 16.2, 0.4); out(box, 16.2, 0.4);
const unroll = T('unroll it, row after row — one long list', 960, 660, { size: 36, color: C.dim });
fade(unroll, 17.6, 0.8);
sync((p, t) => {
  colCells.forEach(cc => {
    const q = clamp((t - 17.0 - cc.d) / 0.75, 0, 1), e = easeIO(q);
    cc.rc2.setAttribute('x', lerp(cc.x0, cc.x1, e));
    cc.rc2.setAttribute('y', lerp(cc.y0, cc.y1, e));
    cc.rc2.setAttribute('width', lerp(CELL, VCELL, e));
    cc.rc2.setAttribute('height', lerp(CELL, VCELL, e));
  });
}, 17.0, 18.2);

/* brackets + label */
const bTop = VY0 - 12, bBot = VY0 + 35 * (VCELL + VGAP) - VGAP + 12;
const brL = path('M' + (VX - 16) + ',' + (bTop + 14) + ' L' + (VX - 26) + ',' + bTop +
                 ' L' + (VX - 26) + ',' + bBot + ' L' + (VX - 16) + ',' + bBot, { stroke: C.dim, w: 2.5 });
const brR = path('M' + (VX + VCELL + 6) + ',' + (bTop + 14) + ' L' + (VX + VCELL + 16) + ',' + bTop +
                 ' L' + (VX + VCELL + 16) + ',' + bBot + ' L' + (VX + VCELL + 6) + ',' + bBot, { stroke: C.dim, w: 2.5 });
fade(brL, 18.4, 0.6); fade(brR, 18.4, 0.6);
const xLab = T('x', VX + 90, VY0 + 300, { size: 46, mono: true, color: C.blue, anchor: 'start' });
const xSub = T('the input — a list of 35 numbers', VX + 90, VY0 + 350, { size: 30, color: C.dim, anchor: 'start' });
fade(xLab, 19.4, 0.7); fade(xSub, 20.0, 0.7);
fade(flyG, 17.0, 0.01);
to(unroll, 22.0, 0.8, { o: 0 });

/* --- bigger pictures ----------------------------------------------------- */
[flyG, brL, brR, xLab, xSub].forEach(e => out(e, 28.3, 0.5));
const g28 = grid(660, 260, 8, 28, 28, DATA.g28, { gap: 1 });
fade(g28.g, 29.0, 1.0);
const l28 = T('28 × 28 = 784 numbers', 660 + 116, 580, { size: 40, mono: true, color: C.text });
fade(l28, 29.8, 0.8);
const ph = T('a phone photo:  4000 × 3000 × 3  =  36,000,000 numbers', 960, 680, { size: 36, color: C.dim });
fade(ph, 35.2, 0.8);
out(g28.g, 41.5, 0.5); out(l28, 41.5, 0.5); out(ph, 41.5, 0.5);

const close = T('A picture is a list of numbers.', 960, 460, { size: 64, weight: '700' });
wipe(close, 42.2, 1.4);

captions(DATA.narr);
progressBar(C.blue);
})();
